```html
<div class="home-page">

  <!-- Thanh công cụ -->
  <header class="navbar">

    <div class="navbar-left">

      <div class="logo">
        Document Storage
      </div>

      <nav class="menu">

        <a type="button"
           (click)="openSection('home')">
          Trang chủ
        </a>

        <a (click)="goToProtectedPage('my-files')">
          Tài liệu của tôi
        </a>

        <a (click)="goToProtectedPage('upload')">
          Upload
        </a>

      </nav>

    </div>

    <div class="top-search">
      <app-search mode="top"></app-search>
    </div>

    <!-- Tài khoản -->
    <div class="profile-dropdown">

      <button
        class="profile-btn"
        type="button"
        (click)="toggleProfileMenu(); $event.stopPropagation()">

        <span class="hamburger-icon">☰</span>

        <span *ngIf="isLoggedIn(); else loginLabel">
          Tài khoản cá nhân
        </span>

        <ng-template #loginLabel>
          <span>Đăng nhập</span>
        </ng-template>

        <span>▾</span>

      </button>

      <div class="profile-menu"
           [class.show]="showProfileMenu">

        <div class="profile-header">

          <div class="avatar">
            👤
          </div>

          <h4>
            Tài khoản của tôi
          </h4>

        </div>

        <div class="profile-item">
          <span class="label">Tên</span>

          <span class="value">
            {{ currentUser.fullName || 'Người dùng' }}
          </span>
        </div>

        <div class="profile-item">
          <span class="label">Email</span>

          <span class="value">
            {{ currentUser.email || 'Chưa có email' }}
          </span>
        </div>

        <hr>

        <button
          class="profile-action"
          type="button">
          ⚙️ Cài đặt tài khoản
        </button>

        <hr>

        <button
          class="logout-link"
          type="button"
          *ngIf="isLoggedIn()"
          (click)="logout()">

          🚪 Đăng xuất

        </button>

        <button
          class="logout-link"
          type="button"
          *ngIf="!isLoggedIn()"
          (click)="goLogin()">

          🚪 Đăng nhập

        </button>

      </div>

    </div>

  </header>

  <!-- Nội dung -->
  <main class="main-content">

    <section
      class="hero"
      *ngIf="currentSection === 'home'">

      <h1>
        Quản lý kho lưu trữ tài liệu
      </h1>

      <p>
        Tìm kiếm, tải lên, chia sẻ và quản lý tài liệu cá nhân trên hệ thống.
      </p>

      <app-search mode="main"></app-search>

    </section>

  </main>

</div>
```
