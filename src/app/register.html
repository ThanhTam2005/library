<div class="stars"></div>

<div class="container">

  <form (ngSubmit)="register()">

    <h2>Đăng ký</h2>

    <p>
      <input
        type="text"
        name="fullName"
        placeholder="Họ tên"
        [(ngModel)]="user.fullName">
    </p>

    <p>
      <input
        type="email"
        name="email"
        placeholder="Email"
        [(ngModel)]="user.email"
        required>
    </p>

    <p>
      <input
        type="password"
        name="password"
        placeholder="Mật khẩu"
        [(ngModel)]="user.password">
    </p>

    <p>
      <input
        type="password"
        name="confirmPassword"
        placeholder="Nhập lại mật khẩu"
        [(ngModel)]="confirmPassword">
    </p>

    <button type="submit">
      Đăng ký
    </button>
<p class="switch-page">
  Đã có tài khoản?
  <a routerLink="/login">Đăng nhập</a>
</p>
  </form>

</div>
