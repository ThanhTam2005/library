<div class="stars"></div>

<div class="container">

  <form (ngSubmit)="login()">

    <h2>Đăng nhập</h2>

    <p>
      <input
        type="email"
        name="email"
        placeholder="Email"
        [(ngModel)]="user.email"
        required>
    </p>

    <p>
      <input
        type="password"
        name="password"
        placeholder="Mật khẩu"
        [(ngModel)]="user.password"
        required>
    </p>

    <button type="submit">
      Đăng nhập
    </button>

    <p class="switch-page">
      Chưa có tài khoản?
      <a routerLink="/register">Đăng ký ngay</a>
    </p>

  </form>

</div>
